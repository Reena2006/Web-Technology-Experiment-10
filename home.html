
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 10 - User Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 22px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        .student-info {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px #00000012;
        }

        h2 {
            text-align: center;
            color: #1d4ed8;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .required {
            color: #dc2626;
        }

        input:not([type="radio"]):not([type="checkbox"]),
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 8px;
        }

        .choices label {
            font-weight: normal;
            margin: 0;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1e40af;
        }

        footer {
            margin-top: 30px;
            background: #172554;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="student-info">
            <strong>Chelsea Reena</strong><br>
            URK24CS9027
        </div>

        <h1>WEB TECHNOLOGY LAB</h1>
        <p>Experiment No. 10</p>
        <p><strong>HTML Form Request Handling Using Node.js and MongoDB</strong></p>
    </header>

    <div class="container">
        <div class="card">

            <h2>User Registration Form</h2>

            <form action="/server" method="POST">

                <label for="name">
                    Name <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    pattern="[A-Za-z ]+"
                    title="Enter letters and spaces only"
                    placeholder="Enter your full name">

                <label for="password">
                    Password <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                    title="Minimum 8 characters with uppercase, lowercase and a number"
                    placeholder="Enter a strong password">

                <label for="age">
                    Age <span class="required">*</span>
                </label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    required
                    min="18"
                    max="100"
                    step="1"
                    placeholder="Enter your age">

                <label for="mobile">
                    Mobile Number <span class="required">*</span>
                </label>
                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    required
                    pattern="[0-9]{10}"
                    maxlength="10"
                    title="Enter exactly 10 digits"
                    placeholder="Enter 10-digit mobile number">

                <label for="email">
                    Email <span class="required">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="example@email.com">

                <label>
                    Gender <span class="required">*</span>
                </label>

                <div class="choices">
                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>

                <label for="state">
                    State <span class="required">*</span>
                </label>

                <select id="state" name="state" required>
                    <option value="">-- Select State --</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Other">Other</option>
                </select>

                <label>
                    Skills <span class="required">*</span>
                </label>

                <div class="choices">
                    <label>
                        <input type="checkbox" name="skills" value="JavaScript" required>
                        JavaScript
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Python">
                        Python
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="C++">
                        C++
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Java">
                        Java
                    </label>
                </div>

                <button type="submit">Submit Registration</button>

            </form>
        </div>
    </div>

    <footer>
        <p>Chelsea Reena | URK24CS9027</p>
        <p>Web Technology Lab - Experiment 10</p>
    </footer>

</body>
</html>
